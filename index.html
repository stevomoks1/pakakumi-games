<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jetpesa aviatrix</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Attempt to make fetch writable if it's read-only (getter-only)
      try {
        const fetchDescriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (fetchDescriptor && !fetchDescriptor.writable && fetchDescriptor.configurable) {
           Object.defineProperty(window, 'fetch', {
             writable: true,
             configurable: true,
             value: window.fetch
           });
        }
      } catch (e) {
        console.error('Failed to patch fetch descriptor:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
